<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — Zeno Kujawa</title>
<meta name="description" content="Blog posts by Zeno Kujawa.">
<style>
  :root{
    --paper:#EDEEEA; --ink:#1A2430; --text:#26303C; --muted:#68717C;
    --rule:#C8CCC5; --rule-hard:#A6ABA3; --train:#2F5D7C;
    --serif:"Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); margin:0; color:var(--text); font-family:var(--serif);
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px; margin:0 auto; padding:52px 24px 80px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:24px;}
  h1{font-size:33px; line-height:1.2; font-weight:600; letter-spacing:-.012em;
    color:var(--ink); margin:0;}
  nav{font-family:var(--sans); font-size:15px;}
  .rule{border:0; border-top:1px solid var(--rule-hard); margin:0 0 26px;}
  .post{padding:18px 0 22px; border-bottom:1px solid var(--rule);}
  .post:first-of-type{padding-top:0;}
  h2{font-size:22px; line-height:1.3; margin:0 0 10px; font-weight:600; color:var(--ink);}
  p{font-size:17px; line-height:1.62; margin:0; color:var(--text);}
  a{color:var(--text); text-decoration:none; border-bottom:1px solid rgba(38,48,60,.32);}
  a:hover{border-bottom-color:var(--text);}
  .meta{font-family:var(--sans); font-size:12px; letter-spacing:.02em; color:var(--muted); margin:0 0 10px;}
  @media (max-width:560px){
    .topbar{align-items:flex-start; flex-direction:column; gap:8px;}
    h1{font-size:27px;}
    h2{font-size:20px;}
    p{font-size:16px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Blog</h1>
      <nav aria-label="Main navigation"><a href="/" target="_self">Home</a></nav>
    </div>
    <hr class="rule">

    <article class="post">
      <div class="meta">19 September 2026</div>
      <h2><a href="/blog/europe-compute/">What does Europe’s “2GW of compute” actually mean?</a></h2>
      <p>An estimate of the frontier model size we could train and serve with Europe’s compute capacity.</p>
    </article>
  </div>
</body>
</html>
