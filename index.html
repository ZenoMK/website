<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeno Kujawa</title>
<meta name="description" content="Personal site of Zeno Kujawa.">
<style>
  :root{
    --paper:#EDEEEA; --ink:#1A2430; --text:#26303C; --muted:#68717C;
    --rule:#C8CCC5; --rule-hard:#A6ABA3; --train:#2F5D7C;
    --serif:"Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--paper); margin:0; color:var(--text); font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;}
  main{width:100%; max-width:640px; padding:40px 24px 64px;}
  h1{font-size:33px; line-height:1.2; font-weight:600; letter-spacing:-.012em;
    color:var(--ink); margin:0 0 18px;}
  .rule{border:0; border-top:1px solid var(--rule-hard); margin:0 0 20px;}
  p{font-size:17px; line-height:1.62; margin:0; max-width:34em;}
  a{color:var(--train); text-decoration:none; border-bottom:1px solid rgba(47,93,124,.32);}
  a:hover{border-bottom-color:var(--train);}
  .mail{font-family:var(--sans); font-size:15.5px; color:var(--ink); white-space:nowrap;}
  :focus-visible{outline:2px solid var(--train); outline-offset:2px;}
  @media (max-width:560px){
    h1{font-size:27px;}
    p{font-size:16px;}
    .mail{white-space:normal;}
  }
</style>
</head>
<body>
<main>
  <h1>Zeno Kujawa</h1>
  <hr class="rule">
  <p>Coming soon! In the meantime, feel free to reach out to me on
  <span class="mail">zeno [dot] kujawa [at] gmail [dot] com</span> or
  <a href="https://www.linkedin.com/in/zeno-kujawa/">LinkedIn</a>.</p>
</main>
</body>
</html>
